<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>小児量チェッカー</title></head><body><header><h1>小児量チェッカー</h1><p>添付文書用量ベース・1日量監査</p></header><main><section class="card"><label>薬剤名・製剤名</label><select id="drug"></select><label>体重（kg）</label><input id="weight" type="number" min="0.1" step="0.1" inputmode="decimal" placeholder="例：15.2"><label>年齢（歳）<span>※年齢区分がある薬剤のみ</span></label><input id="age" type="number" min="0" step="0.1" inputmode="decimal" placeholder="例：4"><label>処方量（1日量）<span>任意：例 1.5 g / 300 mg / 6 mL</span></label><input id="prescribed" type="text" placeholder="例：1.5 g" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><p class="muted">※数字＋単位をキーボードで入力してください（g / mg / mL）。</p><button id="calc">1日量を監査する</button></section><section id="result" class="card hidden"></section><section class="card note"><h2>監査上の注意</h2><ul><li>処方された<strong>1日量</strong>を成分量へ換算して添付文書基準と比較します。</li><li>製剤量（g・mL）と成分量（mg）を自動換算して監査します。</li><li>適応症、年齢制限、腎機能・肝機能、重症度、最大用量、投与間隔等は別途確認してください。</li><li>最終的な処方監査では必ず最新の電子添文を確認してください。</li></ul></section><section class="card"><h2>収載薬剤</h2><p id="count"></p><button class="secondary" id="showData">薬剤データを表示</button><pre id="data" class="hidden"></pre></section></main><footer>小児量チェッカー / 医療者向け計算補助</footer><script src="app.js"></script></body></html>
