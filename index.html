<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>小児量チェッカー</title></head><body><header><h1>小児量チェッカー</h1><p>複数薬剤・添付文書用量ベース・1日量／回数／頓服監査</p></header><main><section class="card"><label>体重（kg）</label><input id="weight" type="number" min="0.1" step="0.1" inputmode="decimal" placeholder="例：15.2"><label>年齢（歳）<span>※年齢区分がある薬剤のみ</span></label><input id="age" type="number" min="0" step="0.1" inputmode="decimal" placeholder="例：4"><div id="medications"></div><button id="addDrug" type="button" class="secondary">＋ 薬剤を追加</button><button id="calc" type="button">全ての処方を監査する</button></section><section id="result" class="card hidden"></section><section class="card note"><h2>監査上の注意</h2><ul><li>複数薬剤を同時に登録し、薬剤ごとに<strong>1日量・1回量・1日回数・頓服</strong>を個別監査します。</li><li>製剤量（g・mL）を成分量（mg）へ換算して比較します。</li><li>投与間隔、適応症、年齢制限、腎機能・肝機能、重症度、最大用量等は別途確認してください。</li><li>薬剤データが単純な式に安全に還元できない場合は「要確認」とする設計を優先してください。</li><li>最終的な処方監査では必ず最新の電子添文を確認してください。</li></ul></section><section class="card"><h2>収載薬剤</h2><p id="count"></p><button class="secondary" id="showData">薬剤データを表示</button><pre id="data" class="hidden"></pre></section></main><footer>小児量チェッカー / 医療者向け計算補助</footer><script src="app.js"></script></body></html>
